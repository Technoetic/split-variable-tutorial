        <button class="pill-btn" type="button" id="theme-toggle"><span aria-hidden="true" class="pill-icon">◐</span><span class="theme-label">테마: 자동</span></button>
        <button class="pill-btn" type="button" id="motion-toggle" aria-pressed="false"><span aria-hidden="true" class="pill-icon">≈</span>움직임 줄이기</button>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<dialog class="modal" id="guard-dialog" aria-labelledby="guard-title" aria-describedby="guard-description">

    <p class="eyebrow">UNSAVED ANSWERS</p>

    <p id="guard-error" class="form-error" role="alert" hidden></p>
    <div class="actions">
      <button class="btn btn-primary" type="button" data-guard="save">저장 후 이동</button>
      <button class="btn btn-secondary" type="button" data-guard="stay">계속 풀기</button>
      <button class="btn btn-ghost" type="button" data-guard="discard">저장 없이 이동</button>
    </div>
  </div>
</dialog>
